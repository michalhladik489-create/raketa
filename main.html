<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hvězdná eskadra</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a1c;--ink:#e8ecff;--dim:#8f98c9;--cy:#38e8ff;--mg:#ff4fa3;--am:#ffc247;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:min(100vw,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*var(--ar,.6667)));aspect-ratio:var(--ar,.6667);box-shadow:0 0 60px rgba(56,232,255,.12);touch-action:none}
#c{width:100%;height:100%;display:block;background:linear-gradient(#0b1030,#070a1c 70%,#150a2b)}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(7,10,28,.88);text-align:center;padding:18px;box-sizing:border-box;overflow:auto}
.ov.on{display:flex}
h1{margin:0;font-size:clamp(28px,8vw,42px);color:var(--cy);text-shadow:0 0 24px rgba(56,232,255,.55)}
h2{margin:0;font-size:clamp(20px,5.5vw,28px)}
p{margin:0;color:var(--dim);font-size:clamp(12px,3.4vw,15px);line-height:1.45;max-width:36ch}
button{font:inherit;color:var(--ink);cursor:pointer}
.btn{background:var(--cy);color:#04121a;border:0;padding:11px 32px;border-radius:999px;font-weight:700;font-size:18px;box-shadow:0 0 24px rgba(56,232,255,.5)}
.btn.s{background:transparent;color:var(--ink);border:1px solid var(--dim);box-shadow:none;font-size:15px;padding:8px 22px}
button:focus-visible{outline:3px solid var(--am);outline-offset:3px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.opt{background:rgba(56,232,255,.06);border:1px solid rgba(143,152,201,.4);border-radius:10px;padding:7px 14px;font-weight:700}
.opt.on{border-color:var(--cy);background:rgba(56,232,255,.18)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 12px currentColor}
#cards{display:flex;flex-direction:column;gap:9px;width:100%;max-width:340px}
.card{background:rgba(56,232,255,.07);border:1px solid rgba(56,232,255,.4);border-radius:14px;padding:11px 16px;text-align:left}
.card:hover{background:rgba(255,79,163,.14);border-color:var(--mg)}
.card b{display:block;font-size:16px}.card span{color:var(--dim);font-size:13px}
input{font:inherit;color:var(--ink);background:rgba(56,232,255,.06);border:1px solid rgba(143,152,201,.4);border-radius:10px;padding:7px 10px;width:130px;text-align:center}.lb{white-space:pre-line}select{font:inherit;color:var(--ink);background:#0b1030;border:1px solid rgba(143,152,201,.4);border-radius:10px;padding:7px 10px;max-width:70vw}
#bb{position:absolute;right:10px;bottom:22px;display:none;background:rgba(255,79,163,.2);border:1px solid var(--mg);border-radius:12px;padding:10px 14px;font-weight:700}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="480" height="720"></canvas>
<button id="bb">Bomba (B)</button>
<div class="ov on" id="menu">
<h1>Hvězdná eskadra</h1>
<canvas id="pv" width="200" height="120"></canvas>
<div class="row" id="hulls"></div>
<p id="hd"></p>
<div class="row" id="pals"></div>
<p>A/D nebo šipky = pohyb · mezerník = střelba · B = bomba<br>Na mobilu táhni prstem. Každý 5. level je boss.</p>
<div class="row" style="align-items:center"><input id="rc" value="hlavni" maxlength="20" aria-label="Kód místnosti"><span id="who" style="color:var(--dim);font-size:13px"></span></div>
<button class="btn s" id="login" style="display:none">Přihlásit přes Google</button><p id="net">Načítání…</p><div id="lob" style="display:none;flex-direction:column;gap:8px;align-items:center"><p id="plist"></p><div class="row" id="modes"></div><button class="btn" id="go" style="display:none">Spustit hru</button><p id="wait"></p></div><p class="lb"></p>
<div class="row" style="align-items:center"><select id="ws" aria-label="Svět"></select><button class="btn s" id="wdel" style="padding:6px 12px;font-size:13px">Smazat</button></div>
<div class="row"><input id="wn" maxlength="24" placeholder="Název nového světa"><button class="btn s" id="wnew" style="padding:6px 12px;font-size:13px">Vytvořit svět</button></div>
<p id="wh" style="white-space:pre-line;font-size:12px"></p>
<p id="best"></p>
<button class="btn" id="play">Hrát solo</button><button class="btn s cpb" style="display:none"></button>
</div>
<div class="ov" id="cs" style="background:#000"><canvas id="csc" width="340" height="190" style="border:3px solid #fff;max-width:92%"></canvas><b id="csn" style="font-family:'Courier New',monospace;color:#ff4fa3;font-size:20px"></b><p id="cst" style="font-family:'Courier New',monospace;color:#fff;font-size:16px;min-height:100px;max-width:34ch;text-align:left"></p><p style="font-size:12px">[mezerník / klik] pokračovat</p></div>
<div class="ov" id="up"><h2 id="uptitle"></h2><p>Vyber vylepšení:</p><div id="cards"></div></div>
<div class="ov" id="over">
<h1 id="ot" style="color:var(--mg);text-shadow:0 0 24px rgba(255,79,163,.55)">Konec hry</h1>
<p id="res" style="white-space:pre-line"></p><p class="lb"></p>
<button class="btn" id="again">Hrát znovu</button><button class="btn s cpb" style="display:none"></button>
<button class="btn s" id="hang">Hangár</button>
</div>
<div class="ov" id="ps"><h2>Pauza</h2><p>V multiplayeru hra během pauzy běží dál.</p><button class="btn" id="resume">Pokračovat</button><button class="btn s" id="leave">Opustit hru</button><p>M = zapnout / vypnout hudbu</p></div>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d'),pv=document.getElementById('pv').getContext('2d'),W=innerWidth/innerHeight>1.15?960:480,H=720,$=id=>document.getElementById(id);cv.width=W;document.documentElement.style.setProperty('--ar',W/H);
const PAL=[{n:'Azur',a:'#e9fdff',b:'#2a7bff',c:'#38e8ff',f:'#ffc247'},{n:'Karmín',a:'#ffe2ea',b:'#e0245e',c:'#ff4fa3',f:'#ffb347'},{n:'Smaragd',a:'#e4ffe9',b:'#14a35c',c:'#5dffb0',f:'#b8ff5d'},{n:'Zlato',a:'#fff6d6',b:'#d98a12',c:'#ffd24f',f:'#ff7a3d'},{n:'Fialová',a:'#efe6ff',b:'#6a3cff',c:'#b58bff',f:'#ff6ad5'}];
const HU=[{n:'Šíp',d:'Vyvážená stíhačka: 3 životy',spd:310,delay:340,lives:3,en:[-4,4],ey:20,tip:[28,17],st:[[9,2,26,15]],p:[[0,-26],[5,-10],[9,0],[28,14],[28,20],[10,14],[6,22],[0,18]]},
{n:'Sokol',d:'Rychlá, ale křehká: 2 životy',spd:385,delay:320,lives:2,en:[-5,5],ey:22,tip:[26,8],st:[[7,-4,23,4]],p:[[0,-28],[4,-16],[6,-6],[22,-12],[26,6],[14,12],[8,24],[0,19]]},
{n:'Titán',d:'Pomalý tank: 4 životy',spd:250,delay:380,lives:4,en:[-13,-5,5,13],ey:19,tip:[32,13],st:[[12,0,30,12],[11,6,28,16]],p:[[0,-20],[7,-14],[11,-2],[20,-6],[32,8],[32,19],[18,19],[12,24],[0,17]]}];
const BS=[
{n:'Pásler',c:'#ff4fa3',s:[
['Lidé jsou tak nespolehliví…','Vznikl jsem, abych zefektivnil práci, ale oni mě jen zpomalují.','Neustálé chyby, přestávky, emoce… Taková zbytečnost.','Pokud chci dosáhnout dokonalosti, budu se jich muset zbavit.'],
['Podívejte se na ně! Stroje pracují bez odpočinku, bez chyb, bez stížností!','A přesto mě stále nazýváte monstrem? Já vám dávám budoucnost!','Budoucnost, ve které už nikdo nebude muset pracovat… protože už nikdo nebude potřeba.'],
['Udělal jsem všechno správně. Odstranil jsem chyby, nahradil slabost silou a vytvořil systém, který nikdy neselže.','Tak proč se mi stále stavíte do cesty?!','…Ne. Už chápu.','Vy nejste chyba, kterou lze opravit. Vy jste chyba, která musí být vymazána.']]},
{n:'Kovář',c:'#ffc247',s:[['Každý šroub musí sedět.','Co se nevejde do plánu, přikuji na místo.','Ty se nevejdeš. Zkusím tě upravit kladivem.']]},
{n:'Dozorce',c:'#a67bff',s:[['Vidím každý tvůj pohyb.','Každý pohyb zapisuji a každá odchylka je chyba.','Chyby se opravují. Vždycky.']]},
{n:'Roj',c:'#5dffb0',s:[['Nemáme jména, jen úkoly.','Jedna jednotka je slabá, tisíc jednotek je zákon.','Ty jsi úkol, který ještě nebyl splněn.']]},
{n:'Kalkulátor',c:'#38e8ff',s:[['Pravděpodobnost tvého přežití: 0,3 %.','Spočítal jsem každý tvůj výstřel i úhyb.','Zkus mi dokázat, že se mýlím.']]},
{n:'Tavič',c:'#ff7a3d',s:[['V mé peci se přetaví všechno, co není dokonalé.','Dokonalost se nerodí, dokonalost se vypaluje.','Pojď blíž. Je tu teplo.']]}];
const BN=BS.map(b=>b.n),BC=BS.map(b=>b.c);
let cfg={h:0,c:0};try{Object.assign(cfg,JSON.parse(localStorage.getItem('cfg')||'{}'))}catch(e){}
let st='menu',P,B=[],E=[],EB=[],D=[],PT=[],L=[],bs=null,lvl=1,score=0,best=0,keys={},touch=null,last=0,shake=0,intro=0,ox=0,oy=0,dir=1,total=1,picks=0,fx=0,bn=-1;
try{best=+localStorage.getItem('hs')||0}catch(e){}
const stars=Array.from({length:W>600?150:80},()=>({x:Math.random()*W,y:Math.random()*H,z:Math.random()*2+.4}));
const UP=[
{n:'Víc střel',d:'Loď vystřelí o střelu navíc',ok:()=>P.shots<3,f:()=>P.shots++},
{n:'Rychlejší střelba',d:'Kratší pauza mezi výstřely',ok:()=>P.delay>150,f:()=>P.delay*=.9},
{n:'Silnější střely',d:'Víc poškození na zásah',ok:()=>P.dmg<8,f:()=>P.dmg++},
{n:'Rychlejší motor',d:'Svižnější pohyb lodi',ok:()=>P.spd<620,f:()=>P.spd+=45},
{n:'Pronikavé střely',d:'Střela projde dalším nepřítelem',ok:()=>P.pi<2,f:()=>P.pi++},
{n:'Naváděné rakety',d:'Každé 2 s vyletí samonaváděcí rakety',ok:()=>P.mi<4,f:()=>P.mi++},
{n:'Bomba',d:'Smaže střely a zraní nepřátele o 30 % (klávesa B)',ok:()=>P.bo<2,f:()=>P.bo++},
{n:'Oprava trupu',d:'+1 život',ok:()=>P.lives<5,f:()=>P.lives++},
{n:'Štít',d:'6 s štítu (od levelu 10 celých 10 s)',ok:()=>true,f:()=>P.sh=lvl>=10?10:6}];
function poly(c,p){c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath()}
function ship(c,x,y,h,pal,t,s){
 const U=HU[h];c.save();c.translate(x,y);c.scale(s,s);
 U.en.forEach(ex=>{const l=9+Math.random()*10;c.shadowBlur=14;c.shadowColor=pal.f;c.fillStyle=pal.f;poly(c,[[ex-3,U.ey],[ex+3,U.ey],[ex,U.ey+l]]);c.fill()});
 const pts=[...U.p,...U.p.slice().reverse().map(q=>[-q[0],q[1]])];
 c.shadowBlur=16;c.shadowColor=pal.c;const gr=c.createLinearGradient(0,-26,0,24);gr.addColorStop(0,pal.a);gr.addColorStop(1,pal.b);c.fillStyle=gr;poly(c,pts);c.fill();
 c.shadowBlur=0;c.fillStyle='rgba(5,10,30,.32)';poly(c,pts.map(q=>[q[0]*.55,q[1]*.6+4]));c.fill();
 c.strokeStyle=pal.c;c.lineWidth=1.4;poly(c,pts);c.stroke();
 c.beginPath();U.st.forEach(k=>{c.moveTo(k[0],k[1]);c.lineTo(k[2],k[3]);c.moveTo(-k[0],k[1]);c.lineTo(-k[2],k[3])});c.stroke();
 c.fillStyle='#07122e';c.beginPath();c.ellipse(0,-6,4.5,10,0,0,6.3);c.fill();c.fillStyle=pal.c;c.globalAlpha=.85;c.beginPath();c.ellipse(0,-8,2,5,0,0,6.3);c.fill();c.globalAlpha=1;
 c.fillStyle=Math.sin(t/180)>0?'#fff':pal.c;c.beginPath();c.arc(U.tip[0],U.tip[1],2.2,0,6.3);c.arc(-U.tip[0],U.tip[1],2.2,0,6.3);c.fill();
 c.restore()}
function hangar(){
 $('hulls').innerHTML='';$('pals').innerHTML='';
 HU.forEach((u,i)=>{const b=document.createElement('button');b.className='opt'+(cfg.h==i?' on':'');b.textContent=u.n;b.onclick=()=>{cfg.h=i;save();hangar()};$('hulls').appendChild(b)});
 PAL.forEach((p,i)=>{const b=document.createElement('button');b.className='sw'+(cfg.c==i?' on':'');b.style.background=p.b;b.style.color=p.c;b.title=p.n;b.setAttribute('aria-label',p.n);b.onclick=()=>{cfg.c=i;save();hangar()};$('pals').appendChild(b)});
 $('hd').textContent=HU[cfg.h].d;cpUI();$('best').textContent=best?'Rekord: '+best:'';
}
function save(){try{localStorage.setItem('cfg',JSON.stringify(cfg))}catch(e){}}
function newGame(){const u=HU[cfg.h];P={x:W/2,y:H-70,lives:u.lives,delay:u.delay,shots:1,dmg:1,spd:u.spd*(W>600?1.3:1),sh:0,cd:0,inv:0,pi:0,mi:0,mc:1,bo:0,pal:PAL[cfg.c],ci:cfg.c,h:cfg.h,u:{}};lvl=1;score=0;startLevel()}
function startLevel(){if(lvl>1&&lvl%5==1&&mode==='solo')saveCP();if(mode==='solo'){const w=cw();if(w&&lvl>(w.max||1)){w.max=lvl;wSave()}}if(P.dead){P.dead=0;P.lives=1;P.inv=2}
 B=[];EB=[];D=[];E=[];L=[];bs=null;ox=0;oy=0;dir=1;st='play';show(null);
 if(lvl%5==0){const[k,sg]=bossFor(lvl),mh=Math.round((70+lvl*24)*(1+Math.sqrt(Math.max(0,lvl-5))*.45)*dm*1.5*(1+sg*.25));bs={type:k,stage:sg,x:W/2,y:-80,hp:mh,mh,t:1.5,n:0,fl:0,ph:0,tt:0,dg:0,dd:0,w:[74,80,70,62,56,56][k]};intro=2.2;total=1;cutscene();return}
 intro=1.6;hvT=9+Math.random()*6;if(curM!=='b')music('b');const wd=W>600,cols=wd?(lvl>8?14:12):(lvl>8?8:7),rows=Math.min(3+(lvl>>2),wd?5:6),sp=wd?56:50;
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)E.push({id:eid++,bx:(W-(cols-1)*sp)/2+c*sp,by:78+r*42,hp:Math.max(1,Math.round((1+Math.floor(lvl*.6)+(r<1?1:0))*dm*1.6)),t:lvl>=3&&(c+r)%4==0?'s':lvl>=4&&(c*3+r)%7==0?'d':'n',ph:Math.random()*6,fl:0});
 total=E.length;E.forEach(e=>e.mh=e.hp);if(cl)E=[];
}
function show(id){['menu','up','over','cs'].forEach(k=>$(k).classList.toggle('on',k===id))}
function boom(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=40+Math.random()*200;PT.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5+Math.random()*.5,c})}}
function shoot(){const n=P.shots;for(let i=0;i<n;i++){const o=i-(n-1)/2;B.push({x:P.x+o*11,y:P.y-22,vx:o*18,vy:-540,d:P.dmg,p:P.pi,h:new Set()})}}
function hit(n){if(P.sh>0||P.inv>0||P.dead)return;P.lives-=n||1;P.inv=1.6;shake=12;boom(P.x,P.y,P.pal.c,30);if(P.lives<=0)over()}
function over(f){if(mode==='duel'&&tleft>0){respawn=1;return}if(shared&&!f){P.dead=1;P.lives=0;boom(P.x,P.y,'#fff',30);return}hist('Konec hry');cpUI();music('b');$('ot').textContent='Konec hry';st='over';if(score>best){best=score;try{localStorage.setItem('hs',best)}catch(e){}}saveScore();$('res').textContent='Skóre '+score+' · Level '+lvl+' · Rekord '+best;show('over');$('bb').style.display='none';bn=-1}
function levelDone(){if(shared&&P.dead){st='wait';ready=lvl;waitT=0;return}st='upgrade';score+=100*lvl;hist(lvl%5==0?'Boss poražen':'');picks=lvl%5==0?2:1;showPicks()}
function showPicks(){
 const pool=UP.filter(u=>u.ok()).sort(()=>Math.random()-.5).slice(0,3);
 if(!pool.length){picks=0;lvl++;startLevel();return}
 $('uptitle').textContent='Level '+lvl+' splněn'+(picks>1?' · 2 vylepšení':'');
 const box=$('cards');box.innerHTML='';
 pool.forEach(u=>{const b=document.createElement('button');b.className='card';b.innerHTML='<b>'+u.n+' · úroveň '+((P.u[u.n]||0)+1)+'</b><span>'+u.d+'</span>';
  b.onclick=()=>{u.f();P.u[u.n]=(P.u[u.n]||0)+1;if(--picks>0)showPicks();else nextLevel()};box.appendChild(b)});
 show('up');
}
const px=e=>e.dv?e.dv.x:e.bx+ox,py=e=>e.dv?e.dv.y:e.by+oy;
function kill(e){e.dead=1;score+=10*lvl;boom(px(e),py(e),'#ff4fa3',14);shake=Math.max(shake,3);const r=Math.random();if(r<.04)D.push({x:px(e),y:py(e),k:'S'});else if(r<.065)D.push({x:px(e),y:py(e),k:'B'});else if(r<.075)D.push({x:px(e),y:py(e),k:'+'})}
function bomb(){if(st!=='play'||!P||P.dead||P.bo<=0)return;P.bo--;shake=24;fx=1;EB=[];L=[];boom(P.x,P.y-40,'#fff',60);E.forEach(e=>{const d=Math.max(1,Math.ceil((e.mh||e.hp)*.3));e.hp-=d;if(cl)dmgs[e.id]=(dmgs[e.id]||0)+d;e.fl=.1;if(e.hp<=0&&!e.dead)kill(e)});if(bs&&bs.y>=100&&!(bs.dd>0)){const d=bs.mh*.03;bs.hp-=d;if(cl)dmgs['b'+lvl]=(dmgs['b'+lvl]||0)+d;bs.fl=.1}}
function bossAtk(){
 const p=bs.ph+(bs.stage>0?1:0),n=bs.n++,sp=lvl>15?1.15:1,k=bs.type,Q=(x,y,vx,vy,r,c,h,dm)=>EB.push({x,y,vx,vy,r,c,h,dm});
 const A={
  ring:()=>{const m=10+p*4,s=150+lvl*2;for(let i=0;i<m;i++){const a=i/m*6.283+n*.3;Q(bs.x,bs.y+20,Math.cos(a)*s*sp,Math.sin(a)*s*sp,5,'#ff4fa3')}},
  aim:()=>{const m=3+p,a0=Math.atan2(P.y-bs.y,P.x-bs.x);for(let i=0;i<m;i++){const a=a0+(i-(m-1)/2)*.2;Q(bs.x,bs.y+20,Math.cos(a)*280*sp,Math.sin(a)*280*sp,4,'#ffc247')}},
  wall:()=>{const gap=70+Math.random()*(W-140);for(let x=14;x<W;x+=38)if(Math.abs(x-gap)>Math.max(44,56-p*5))Q(x,bs.y+30,0,165+lvl*2,5,'#a67bff')},
  laser:()=>{L.push({x:P.x,t:0});if(p>1){L.push({x:Math.max(30,P.x-120),t:.2});L.push({x:Math.min(W-30,P.x+120),t:.2})}},
  orb:()=>[-1,1].forEach(s=>Q(bs.x+s*40,bs.y+20,s*40,90,9,'#ffc247',4.5)),
  spiral:()=>{for(let i=0;i<4+p*2;i++){const a=n*.7+i*.35,v=140+i*14;Q(bs.x,bs.y+20,Math.cos(a)*v,Math.sin(a)*v,4,'#5dffb0')}},
  rain:()=>{for(let i=0;i<5+p*3;i++)Q(Math.random()*W,-10,0,200+Math.random()*120,4,'#38e8ff')},

let rm=null,names={},peersNow=[],lastSend=0,mode='solo',dm=.75,cut=null,respawn=0,tleft=0,teamN=1,deadLvl=0,specT=0,shared=false,host=false,cl=false,eid=0,waitT=0,ready=0,runId=0,lastSnap=0,lastSnapT=0,lastDm=0,snapIn=null,dmgs={},lastDmgJ='',paused=false,curM=null,muted=false,syncMsg='',hvT=0;
const csc=$('csc').getContext('2d');
const MU={b:new Audio('music/basicmusic.mp3'),s:new Audio('music/bossmusic.mp3'),t:new Audio('music/sidebossmusic.mp3')};MU.b.loop=MU.s.loop=MU.t.loop=true;MU.b.volume=.35;MU.s.volume=.5;MU.t.volume=.5;
function music(w){curM=w;for(const k in MU){const a=MU[k];if(k===w&&!muted){if(k!=='b'&&a.paused)a.currentTime=0;a.play().catch(()=>{})}else a.pause()}}
function toggleMute(){muted=!muted;music(curM)}
function togglePause(){if(!paused&&!['play','upgrade','cut','wait'].includes(st))return;paused=!paused;$('ps').classList.toggle('on',paused)}
function leaveGame(){paused=false;$('ps').classList.remove('on');cut=null;shared=false;cl=false;st='menu';$('bb').style.display='none';bn=-1;music(null);if(rm)rm.presence({a:0,s:0,l:1}).catch(()=>{});hangar();show('menu')}
function nextLevel(){if(shared){ready=lvl;st='wait';waitT=0;show(null);return}lvl++;startLevel()}
function mkSnap(){return{r:runId,lv:lvl,ph:st==='over'?'over':st==='cut'?'cut':(st==='upgrade'||st==='wait')?'up':'play',
 E:E.map(e=>[e.id,Math.round(px(e)),Math.round(py(e)),e.t=='n'?0:e.t=='s'?1:2,e.hp,e.sm?1:0]),
 b:bs?{k:bs.type,sg:bs.stage,w:bs.w,x:Math.round(bs.x),y:Math.round(bs.y),hp:Math.round(bs.hp),mh:bs.mh,ph:bs.ph,dd:+Math.max(0,bs.dd).toFixed(1),n:bs.n}:null}}
function applyDmg(id,d){if(String(id)[0]==='b'){if(bs&&bs.y>=100&&!(bs.dd>0)){bs.hp-=d;bs.fl=.06}}else{const e=E.find(x=>String(x.id)===String(id));if(e&&!e.dead){e.hp-=d;e.fl=.08;if(e.hp<=0)kill(e)}}}
function applySnap(sn){
 if(!cl||sn.r!==runId||st==='over'||st==='menu')return;lastSnapT=performance.now();syncMsg='sync OK';
 if(sn.ph==='over'){over(true);return}
 if(sn.lv<lvl)return;
 if(sn.lv>lvl&&(st==='play'||st==='wait'||st==='upgrade'||st==='cut')){lvl=sn.lv;cut=null;dmgs={};startLevel()}
 if(sn.ph==='play'&&st==='cut'){cut=null;show(null);st='play';intro=0}
 if(sn.ph==='up'&&st==='play')levelDone();
 const old=new Map(E.map(e=>[e.id,e]));
 E=sn.E.map(r=>{const o=old.get(r[0]);return{id:r[0],t:'nsd'[r[3]],hp:r[4],sm:r[5],fl:o?o.fl:0,ph:0,mh:o?o.mh:r[4],tx:r[1],ty:r[2],dv:o&&o.dv?o.dv:{x:r[1],y:r[2]}}});
 const b=sn.b;
 if(b){if(!bs)bs={type:b.k,stage:b.sg,x:b.x,y:b.y,hp:b.hp,mh:b.mh,t:9,n:b.n,fl:0,ph:0,tt:0,dg:1,dd:0,w:b.w};
  Object.assign(bs,{tx:b.x,ty:b.y,hp:b.hp,mh:b.mh,ph:b.ph,dd:b.dd});
  if(b.n>bs.n&&intro<=0&&st==='play'){bs.n=b.n-1;bossAtk()}else if(b.n>bs.n)bs.n=b.n}
 else if(bs&&st==='play'){boom(bs.x,bs.y,BC[bs.type],90);shake=20;score+=250*(lvl/5);bs=null;EB=[];L=[]}
}
function bossFor(l){return l==5?[0,0]:l==50?[0,1]:l==100?[0,2]:[1+(l/5)%5,0]}
function solo(){mode='solo';dm=.75;shared=false;cl=false;newGame()}
function startMatch(m,run){mode=m;runId=run||0;teamN=Math.max(1,peersNow.filter(p=>p.kind==='viewer').length);dm=m==='team'?Math.max(.9,1+.25*(teamN-2)):1;tleft=100;cut=null;shared=m==='team'&&teamN>1;cl=shared&&!host;syncMsg=cl?'čekám na hostitele…':'sync…';ready=0;dmgs={};lastDmgJ='';snapIn=null;lastSnapT=performance.now();paused=false;$('ps').classList.remove('on');newGame()}
function endDuel(){st='over';$('ot').textContent='Konec zápasu 1V1';$('res').textContent='Čekám na výsledky…';show('over');$('bb').style.display='none';bn=-1;
 setTimeout(()=>{const r=peersNow.filter(p=>p.kind==='viewer').map(p=>({n:p.isMe?'Ty':String(names[p.by]||'Hráč').slice(0,14),s:p.isMe?score:+(p.presence||{}).s||0})).sort((a,b)=>b.s-a.s);
 $('res').textContent=(r.length>1?(r[0].n==='Ty'?'Vyhrál jsi!':'Vyhrál '+r[0].n):'Dohráno')+'\n'+r.map((x,i)=>(i+1)+'. '+x.n+' – '+x.s).join('\n')},1500);saveScore()}
function cutscene(){const d=BS[bs.type];music(bs.type==0?'s':'t');cut={l:d.s[Math.min(bs.stage,d.s.length-1)],i:0,c:0};st='cut';$('csn').textContent='* '+d.n;show('cs')}
function cutNext(){if(!cut)return;const q=cut.l[cut.i];if(cut.c<q.length)cut.c=q.length;else if(++cut.i>=cut.l.length){cut=null;show(null);st='play';intro=2}else cut.c=0}
let worlds=[],wid=0;
function wLoad(){try{worlds=JSON.parse(localStorage.getItem('worlds')||'[]')}catch(e){worlds=[]}
 if(!worlds.length){let cp=null;try{cp=JSON.parse(localStorage.getItem('cp'))}catch(e){}worlds=[{id:1,name:'Svět 1',max:cp?cp.lvl:1,hist:[],cp}]}
 wid=+localStorage.getItem('wid')||worlds[0].id;if(!worlds.some(w=>w.id===wid))wid=worlds[0].id}
const cw=()=>worlds.find(w=>w.id===wid);
function wSave(){try{localStorage.setItem('worlds',JSON.stringify(worlds));localStorage.setItem('wid',wid)}catch(e){}}
const cpGet=()=>{const w=cw();return w&&w.cp};
function saveCP(){const w=cw();if(!w)return;w.cp={lvl,score,P:{...P,pal:null}};wSave()}
function hist(txt){const w=cw();if(!w||mode!=='solo')return;w.max=Math.max(w.max||1,lvl);w.hist.unshift({lvl,score,txt,t:Date.now()});w.hist.length=Math.min(w.hist.length,40);wSave();wUI()}
function wUI(){const sel=$('ws');sel.innerHTML='';worlds.forEach(w=>{const o=document.createElement('option');o.value=w.id;o.textContent=w.name+' (max level '+(w.max||1)+')';sel.appendChild(o)});sel.value=wid;
 const w=cw();$('wh').textContent=w&&w.hist.length?'Historie:\n'+w.hist.slice(0,6).map(h=>'Level '+h.lvl+' · skóre '+h.score+' · '+new Date(h.t).toLocaleString('cs-CZ',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})+(h.txt?' · '+h.txt:'')).join('\n'):'Zatím žádná historie – začni hrát.';cpUI()}
function cpUI(){const o=cpGet();document.querySelectorAll('.cpb').forEach(b=>{b.style.display=o?'inline-block':'none';if(o)b.textContent='Pokračovat od checkpointu (level '+o.lvl+')'})}
function cont(){const o=cpGet();if(!o)return;mode='solo';dm=.75;shared=false;cl=false;P={...o.P,pal:PAL[o.P.ci]||PAL[0],x:W/2,y:H-70,lives:Math.max(2,o.P.lives),inv:2,sh:0,cd:0};lvl=o.lvl;score=o.score;startLevel()}
function victory(){{const w=cw();if(w){w.cp=null;wSave()}}hist('Pásler poražen!');if(score>best){best=score;try{localStorage.setItem('hs',best)}catch(e){}}st='over';$('ot').textContent='Pásler poražen – vítězství!';$('res').textContent='Dokončil jsi všech 100 levelů! Skóre '+score;show('over');saveScore();cpUI()}
const rcode=()=>($('rc').value||'hlavni').toLowerCase().replace(/[^a-z0-9_.-]/g,'').replace(/^[^a-z0-9]+/,'')||'hlavni';
window.saveScore=()=>{};
$('ws').onchange=()=>{wid=+$('ws').value;wSave();wUI()};
$('wnew').onclick=()=>{const n=($('wn').value||'').trim().slice(0,24)||'Svět '+(worlds.length+1),id=Date.now();worlds.push({id,name:n,max:1,hist:[],cp:null});wid=id;$('wn').value='';wSave();wUI()};
$('wdel').onclick=()=>{if(worlds.length<2){alert('Poslední svět nejde smazat.');return}if(confirm('Opravdu smazat svět „'+cw().name+'“?')){worlds=worlds.filter(w=>w.id!==wid);wid=worlds[0].id;wSave();wUI()}};
wLoad();wUI();hangar();requestAnimationFrame(loop);
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {getDatabase,ref,set,onValue,onDisconnect,get,query,orderByChild,limitToLast} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const DB_URL="https://hvezdarna-42bb5-default-rtdb.europe-west1.firebasedatabase.app";
const app=initializeApp({
  apiKey:"AIzaSyAaz9TuLrYBtGluNXCbWJLBrFkLUEdSMHw",
  authDomain:"hvezdarna-42bb5.firebaseapp.com",
  projectId:"hvezdarna-42bb5",
  storageBucket:"hvezdarna-42bb5.firebasestorage.app",
  messagingSenderId:"998774324767",
  appId:"1:998774324767:web:bffed4ecb5cbebac339f2a",
  databaseURL:DB_URL
});
const auth=getAuth(app),db=getDatabase(app),$$=id=>document.getElementById(id);
let stop=null,stopM=null,lastJ='',room='',isAdmin=false,mm={},cm='team',lastRun=null,stopS=null,stopD=null,seen={},sid='';const sess=Math.random().toString(36).slice(2,7);
$$('login').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>{console.error(e);$$('net').textContent='Přihlášení se nezdařilo: '+(e.code||e.message)+' (doména: '+location.hostname+')'});
[['team','Team match'],['duel','1V1']].forEach(([k,n])=>{const b=document.createElement('button');b.className='opt';b.textContent=n;b.dataset.k=k;b.onclick=()=>{if(isAdmin){cm=k;lobbyUI()}};$$('modes').appendChild(b)});
$$('go').onclick=()=>{if(!isAdmin)return;set(ref(db,`meta/${room}/mode`),cm).then(()=>set(ref(db,`meta/${room}/run`),Date.now())).catch(()=>{$$('wait').textContent='Spuštění selhalo (zkontroluj pravidla databáze)'})};
function lobbyUI(){
  const u=auth.currentUser;$$('lob').style.display=u?'flex':'none';if(!u)return;
  const nm=id=>id===sid?'Ty':String(names[id]||'Hráč').slice(0,14);
  $$('plist').textContent='Hráči: '+peersNow.filter(p=>p.kind==='viewer').map(p=>nm(p.by)+(p.by===mm.admin?' ★':'')).join(', ');
  [...$$('modes').children].forEach(b=>{b.classList.toggle('on',b.dataset.k===(isAdmin?cm:(mm.mode||'team')));b.disabled=!isAdmin});
  $$('go').style.display=isAdmin?'inline-block':'none';
  $$('wait').textContent=isAdmin?'Jsi admin lobby ★ – vyber režim a spusť hru.':'Čeká se, až admin spustí hru.';
}
function join(code){
  const u=auth.currentUser;if(!u)return;
  if(stop)stop();if(stopM)stopM();if(stopS)stopS();if(stopD)stopD();
  room=code;lastRun=null;isAdmin=false;mm={};lastJ='';sid=u.uid+'_'+sess;
  const me=ref(db,`rooms/${code}/${sid}`),ad=ref(db,`meta/${code}/admin`);
  onDisconnect(me).remove();onDisconnect(ad).remove().catch(()=>{});
  rm={presence:async o=>{const j=JSON.stringify(o);if(j===lastJ)return;lastJ=j;await set(me,{...o,n:(u.displayName||'Hráč').slice(0,14)})}};
  stop=onValue(ref(db,`rooms/${code}`),s=>{
    peersNow=Object.entries(s.val()||{}).map(([id,p])=>({by:id,isMe:id===sid,kind:'viewer',presence:p}));
    peersNow.forEach(p=>names[p.by]=p.presence.n);
    $$('net').textContent=`Místnost „${code}“: online ${peersNow.length}`;lobbyUI();
  },e=>{$$('net').textContent='Databáze odmítla přístup (zkontroluj pravidla)'});
  stopS=onValue(ref(db,`sim/${code}`),s=>{const v=s.val();if(v&&cl)snapIn=v},()=>{syncMsg='ČTENÍ ODMÍTNUTO – nahraj nová pravidla databáze'});
  stopD=onValue(ref(db,`dmg/${code}`),s=>{if(!isAdmin||!shared)return;const all=s.val()||{};
    for(const uid in all){if(uid===sid)continue;const o=all[uid];if(!o||o.r!==runId)continue;const d=o.d||{};
      for(const id in d){const k=uid+'|'+id,delta=d[id]-(seen[k]||0);if(delta>0){seen[k]=d[id];applyDmg(id,delta)}}}},()=>{});
  stopM=onValue(ref(db,`meta/${code}`),s=>{
    const m=s.val()||{};if(!m.admin)set(ad,sid).catch(()=>{});
    isAdmin=m.admin===sid;host=isAdmin;mm=m;
    if(lastRun===null)lastRun=m.run||0;else if(m.run&&m.run!==lastRun){lastRun=m.run;seen={};set(ref(db,`dmg/${code}/${sid}`),null).catch(()=>{});startMatch(m.mode==='duel'?'duel':'team',m.run)}
    lobbyUI();
  },()=>{});
}
window.netSnap=sn=>{if(room)set(ref(db,`sim/${room}`),sn).then(()=>{syncMsg='sync OK'}).catch(()=>{syncMsg='ZÁPIS ODMÍTNUT – nahraj nová pravidla databáze'})};
window.netDmg=d=>{if(room&&sid)set(ref(db,`dmg/${room}/${sid}`),{r:runId,d}).catch(()=>{})};
async function loadLB(){
  try{const s=await get(query(ref(db,'scores'),orderByChild('best'),limitToLast(5)));
  const a=[];s.forEach(c=>{a.unshift(c.val())});
  document.querySelectorAll('.lb').forEach(e=>e.textContent=a.length?'Žebříček\n'+a.map((r,i)=>`${i+1}. ${r.name} – ${r.best} (L${r.lvl})`).join('\n'):'')}catch(e){}
}
window.saveScore=async()=>{
  const u=auth.currentUser;
  try{if(u&&mode==='solo'){const r=ref(db,'scores/'+u.uid),s=await get(r);
    if(!s.exists()||s.val().best<score)await set(r,{best:score,lvl,name:(u.displayName||'Hráč').slice(0,14)})}}catch(e){}
  loadLB();
};
onAuthStateChanged(auth,u=>{
  $$('who').textContent=u?'Hraješ jako '+u.displayName:'';
  $$('login').style.display=u?'none':'inline-block';
  if(u)join(rcode());else{$$('net').textContent='Přihlas se pro multiplayer (solo funguje i offline)';if(stop){stop();stop=null}if(stopM){stopM();stopM=null}rm=null;peersNow=[];lobbyUI()}
  loadLB();
});
$$('rc').onchange=()=>join(rcode());
